<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Админка: Бронирования и Автопарк</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
        }

        h1,
        h2 {
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #0f0;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #0f0;
            color: #000;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 5px;
        }

        button:hover {
            background: #fff;
        }

        .cancel-btn,
        .delete-btn {
            background: red;
            color: #fff;
        }

        .action-cell {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-start;
        }

        .photo-upload-container {
            display: flex;
            gap: 5px;
            align-items: center;
            border-top: 1px dashed #0f0;
            padding-top: 10px;
            margin-top: 5px;
            width: 100%;
        }

        .photo-upload-container input[type="file"] {
            color: #0f0;
            font-size: 11px;
            max-width: 150px;
        }

        .form-block {
            border: 1px dashed #0f0;
            padding: 20px;
            margin-top: 20px;
            max-width: 500px;
        }

        .form-block input,
        .form-block select,
        .form-block textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            box-sizing: border-box;
        }

        /* Стили для модалки редактирования */
        .edit-modal {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            background: #000;
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 100;
            box-shadow: 0 0 20px #0f0;
            width: 450px;
        }

        .edit-modal.active {
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 99;
        }

        .modal-overlay.active {
            display: block;
        }
    </style>
</head>

<body>
    <h1>СИСТЕМА КОНТРОЛЯ: АКТИВНЫЕ БРОНИРОВАНИЯ</h1>
    <table>
        <thead>
            <tr>
                <th>Оформлено</th>
                <th>Пользователь (Email)</th>
                <th>Машина</th>
                <th>Период аренды</th>
                <th>Статус</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="bookings-list"></tbody>
    </table>

    <h2>УПРАВЛЕНИЕ АВТОПАРКОМ</h2>
    <table>
        <thead>
            <tr>
                <th>Модель</th>
                <th>Класс</th>
                <th>Цена (₽/сутки)</th>
                <th>Доступность</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="admin-cars-list"></tbody>
    </table>

    <h2>ДОБАВИТЬ НОВУЮ МАШИНУ</h2>
    <div class="form-block">
        <form id="add-car-form">
            <label>Модель авто:</label>
            <input type="text" name="model" required placeholder="Например: Audi">
            <label>Класс:</label>
            <select name="category" required>
                <option value="economy">Эконом</option>
                <option value="comfort">Комфорт</option>
                <option value="business">Бизнес</option>
                <option value="special">Спецтехника</option>
            </select>
            <label>Цена за сутки (₽):</label>
            <input type="number" name="price_per_day" required placeholder="1000">

            <label>Технический регламент (каждая характеристика с новой строки):</label>
            <textarea name="tech_regulations" rows="6" placeholder="ПРИВОД: ПОЛНЫЙ&#10;КОРОБКА: АВТОМАТ"></textarea>

            <label>Фотография машины:</label>
            <input type="file" name="image" accept="image/*" required>
            <button type="submit" style="width: 100%; padding: 10px; margin-top: 10px;">ДОБАВИТЬ В АВТОПАРК</button>
        </form>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="edit-modal" id="edit-modal">
        <h2 style="margin-top:0;">РЕДАКТИРОВАНИЕ</h2>
        <form id="edit-car-form" class="form-block" style="border:none; padding:0; margin:0; max-width: 100%;">
            <input type="hidden" id="edit-id">
            <label>Класс:</label>
            <select id="edit-category" required>
                <option value="economy">Эконом</option>
                <option value="comfort">Комфорт</option>
                <option value="business">Бизнес</option>
                <option value="special">Спецтехника</option>
            </select>
            <label>Новая цена (₽/сутки):</label>
            <input type="number" id="edit-price" required>

            <label>Технический регламент (каждая характеристика с новой строки):</label>
            <textarea id="edit-tech" rows="6"></textarea>

            <div style="display:flex; justify-content:space-between; margin-top: 15px;">
                <button type="submit">СОХРАНИТЬ</button>
                <button type="button" class="cancel-btn" onclick="closeEditModal()">ОТМЕНА</button>
            </div>
        </form>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { alert('Доступ закрыт. Авторизуйтесь как администратор.'); window.location.href = '/auth.html'; }
        const headers = { 'Authorization': `Bearer ${token}` };

        let adminCars = []; // Хранилище списка авто на клиенте

        async function loadBookings() {
            try {
                const res = await fetch('/api/admin/bookings', { headers });
                if (res.status === 401 || res.status === 403) throw new Error('Нет прав админа');
                const data = await res.json();
                const tbody = document.getElementById('bookings-list');
                tbody.innerHTML = '';
                if (data.bookings.length === 0) { tbody.innerHTML = '<tr><td colspan="6">Бронирований пока нет.</td></tr>'; return; }

                data.bookings.forEach(b => {
                    const created = new Date(b.created_at).toLocaleString('ru-RU');
                    const start = b.start_date ? new Date(b.start_date).toLocaleDateString('ru-RU') : '---';
                    const end = b.end_date ? new Date(b.end_date).toLocaleDateString('ru-RU') : '---';
                    const actionBtn = b.status === 'active' ? `<button class="cancel-btn" onclick="cancelBooking('${b.booking_id}')">Аннулировать</button>` : '---';
                    tbody.innerHTML += `<tr><td>${created}</td><td>${b.user_email}</td><td>${b.car_model}</td><td>${start} — ${end}</td><td>[${b.status.toUpperCase()}]</td><td>${actionBtn}</td></tr>`;
                });
            } catch (err) { alert(err.message); if (err.message === 'Нет прав админа') window.location.href = '/auth.html'; }
        }

        async function loadAdminCars() {
            try {
                const res = await fetch('/api/admin/cars', { headers });
                const data = await res.json();
                adminCars = data.cars; // Сохраняем массив машин
                const tbody = document.getElementById('admin-cars-list');
                tbody.innerHTML = '';
                if (data.cars.length === 0) { tbody.innerHTML = '<tr><td colspan="5">Автопарк пуст.</td></tr>'; return; }

                data.cars.forEach(car => {
                    const status = car.is_available ? 'СВОБОДНА' : 'В АРЕНДЕ';
                    tbody.innerHTML += `
                        <tr>
                            <td>${car.model}</td><td>${car.category.toUpperCase()}</td><td>${car.price_per_day}</td><td>[${status}]</td>
                            <td class="action-cell">
                                <button onclick="openEditModal('${car.id}')">Изменить параметры</button>
                                <button class="delete-btn" onclick="deleteCar('${car.id}')">Списать машину</button>
                                <div class="photo-upload-container">
                                    <input type="file" id="photo-${car.id}" accept="image/*">
                                    <button onclick="updateCarPhoto('${car.id}')" style="font-size: 10px;">Обновить фото</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function cancelBooking(id) {
            if (!confirm('Точно аннулировать бронь?')) return;
            try {
                const res = await fetch(`/api/admin/bookings/${id}/cancel`, { method: 'PUT', headers });
                const data = await res.json();
                alert(data.message || data.error);
                loadBookings();
            } catch (err) { alert('Ошибка'); }
        }

        async function deleteCar(id) {
            if (!confirm('Точно списать машину? Она исчезнет с сайта.')) return;
            try {
                const res = await fetch(`/api/admin/cars/${id}`, { method: 'DELETE', headers });
                const data = await res.json();
                alert(data.message || data.error);
                loadAdminCars();
            } catch (err) { alert('Ошибка'); }
        }

        async function updateCarPhoto(id) {
            const fileInput = document.getElementById(`photo-${id}`);
            if (!fileInput.files.length) { alert('Выберите файл!'); return; }
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            try {
                const res = await fetch(`/api/admin/cars/${id}/photo`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }, body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message); fileInput.value = ''; loadAdminCars();
            } catch (err) { alert('Ошибка: ' + err.message); }
        }

        // Заполнение полей из сохраненного массива машин во избежание багов экранирования кавычек
        function openEditModal(id) {
            const car = adminCars.find(c => c.id === id);
            if (!car) return;

            document.getElementById('edit-id').value = car.id;
            document.getElementById('edit-category').value = car.category;
            document.getElementById('edit-price').value = car.price_per_day;
            document.getElementById('edit-tech').value = car.tech_regulations || '';
            document.getElementById('edit-modal').classList.add('active');
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            document.getElementById('modal-overlay').classList.remove('active');
        }

        document.getElementById('edit-car-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const category = document.getElementById('edit-category').value;
            const price = document.getElementById('edit-price').value;
            const tech = document.getElementById('edit-tech').value;

            try {
                const res = await fetch(`/api/admin/cars/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ category: category, price_per_day: price, tech_regulations: tech })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
                closeEditModal();
                loadAdminCars();
            } catch (err) { alert('Ошибка: ' + err.message); }
        });

        document.getElementById('add-car-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/admin/cars', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message); e.target.reset(); loadAdminCars();
            } catch (err) { alert('Ошибка: ' + err.message); }
        });

        loadBookings();
        loadAdminCars();
    </script>
</body>

</html>
